[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasoorbital"
version = "1.6.0"
description = "Predicción de pasos de satélites para escucha radio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Marcos Matamala Fernandez" },
  { name = "DeepSeek Harness (deepseek-flash)" },
]
maintainers = [{ name = "Marcos Matamala Fernandez" }]
keywords = ["satellite", "tle", "sgp4", "radio", "sdr", "gnome", "gtk4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "sgp4>=2.23",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["skyfield>=1.49"]

[project.scripts]
pasoorbital = "pasoorbital.cli:main"
pasoorbital-gui = "pasoorbital_gui.app:main"

[project.urls]
Homepage = "https://github.com/asterion/pasoorbital"
Source = "https://github.com/asterion/pasoorbital"
Issues = "https://github.com/asterion/pasoorbital/issues"

[tool.setuptools]
packages = ["pasoorbital", "pasoorbital_gui"]
include-package-data = true

[tool.setuptools.package-dir]
pasoorbital = "pasoorbital"
pasoorbital_gui = "desktop/pasoorbital_gui"

[tool.setuptools.package-data]
pasoorbital_gui = ["style.css"]
