name: Informar de un fallo
description: Algo no funciona como debería.
title: "[Fallo]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar PasoOrbital. No incluyas datos personales
        ni direcciones exactas.
  - type: input
    id: version
    attributes:
      label: Versión de PasoOrbital
      placeholder: "1.4.0 / paquete .deb / web"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Aplicación de escritorio (GNOME)
        - Web local
        - CLI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir…\n2. Pulsar…\n3. Ver…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errores o registros
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas
      description: Arrastra imágenes aquí si ayudan a entender el problema.
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He buscado issues parecidos.
          required: true
        - label: No he incluido datos personales ni secretos.
          required: true
