      <path d="M 812 432 C 842 405 875 412 900 438" fill="none" stroke="#E06A24" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

      <!-- franja cobriza del borde exterior -->
      <path d="M 900 730 C 945 690 960 630 950 570" fill="none" stroke="#C85A17" stroke-width="28" stroke-linecap="round"/>
    </g>

    <path d="M 600 700
             C 660 780 790 805 870 745
             C 930 700 960 630 955 560
