      <path d="M 785 430 C 825 440 860 470 880 510 C 855 480 825 460 780 450 Z" fill="#3B4352" opacity="0.9"/>
      <path d="M 915 620 C 935 585 942 545 935 510" fill="none" stroke="#3B4352" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
      <path d="M 825 695 C 858 684 884 662 900 635" fill="none" stroke="#262B36" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
      <path d="M 812 520 C 836 528 855 545 866 570" fill="none" stroke="#3B4352" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

      <!-- capa cobriza de la punta -->
