<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Astro, mascota de PasoOrbital</title>
  <desc id="desc">Zorro de Darwin de estilo vectorial plano, sentado y mirando hacia el cielo. Pelaje gris pizarra, patas y bordes de orejas cobrizos, pecho crema y ojos azules.</desc>

  <!-- ==================== PALETA ====================
       tinta      #1E222A
       pizarra    #2F3542
       sombra     #262B36
       brillo     #3B4352
       cobre      #C85A17
       cobre som. #A84A12
       cobre luz  #E06A24
       crema      #F5F6FA
       crema som. #E2E4EE
       ojo        #3742FA
       ojo oscuro #2A34C9
  ==================================================== -->

  <!-- ==================== COLA ==================== -->
  <g id="tail">
