               C 660 780 790 805 870 745
               C 930 700 960 630 955 560
               C 950 500 930 450 900 420
               C 875 395 845 390 825 410
               C 805 430 800 460 815 485
               C 790 500 760 520 730 545
               C 690 580 645 640 600 700
               Z"/>
